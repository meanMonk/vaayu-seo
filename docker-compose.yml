# Root orchestrator: includes every package's compose.yaml.
# Regenerated by `setup-project` when packages are added.
# App services join the shared external `vaayu_db` network where MongoDB
# runs (start it locally with docker-compose.infra.yml; on the VPS it
# already exists on vaayu_db, so this file alone is enough there).
#
#   docker compose -f docker-compose.infra.yml up -d   (local infra, once)
#   docker compose up -d --build
name: vaayu-seo

include:
  - path: packages/web/seo/compose.yaml
  - path: packages/backend/seo-api/compose.yaml

