# seo-api.vaayulabs.com
# Vaayu SEO Checkup API (hono) — proxies to Docker container on port {{PORT}}

server {
    listen 80;
    server_name seo-api.vaayulabs.com;

    # Let's Encrypt HTTP-01 challenges (served from the certbot webroot).
    # Must come before the redirect so ACME can reach /.well-known/acme-challenge/.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    if ($http_x_forwarded_proto = "https") {
        set $skip_redirect 1;
    }
    if ($skip_redirect != "1") {
        return 301 https://seo-api.vaayulabs.com$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:{{PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl http2;
    server_name seo-api.vaayulabs.com;

    ssl_certificate /etc/letsencrypt/live/seo-api.vaayulabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seo-api.vaayulabs.com/privkey.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/javascript application/json text/plain text/css;

    location / {
        proxy_pass http://127.0.0.1:{{PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
